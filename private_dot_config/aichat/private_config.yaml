# aichat -> MiniMax M3 over the OpenAI-compatible route.
# The API key is NOT stored here: aichat resolves {CLIENT_NAME}_API_KEY from the
# environment, and MINIMAX_API_KEY is already exported by `envs`.

model: minimax:MiniMax-M3
stream: true
save: true

clients:
  - type: openai-compatible
    name: minimax
    api_base: https://api.minimax.io/v1
    # Known caveat: in plain chat mode (`aichat "..."`) M3 returns its reasoning
    # inline in `content` wrapped in <think> tags. MiniMax suppresses that with
    # reasoning_split, but aichat 0.30's `patch:` block did not apply it here in
    # either documented form, so the tags remain in chat mode.
    #
    # This does NOT affect ALT+E (`aichat -e`), which is the primary use here:
    # execute mode returns a bare command with no <think> tags. Verified against
    # several prompts.
    models:
      - name: MiniMax-M3
        max_input_tokens: 1000000
        supports_function_calling: true
        supports_vision: true
      - name: MiniMax-M2.7
        max_input_tokens: 1000000
        supports_function_calling: true
      - name: MiniMax-M2.7-highspeed
        max_input_tokens: 1000000
        supports_function_calling: true
