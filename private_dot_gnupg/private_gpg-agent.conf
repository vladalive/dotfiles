default-cache-ttl 31536000
max-cache-ttl 31536000
# Was in the live file on both hosts before it was tracked here: lets
# `gpg --pinentry-mode loopback` take a passphrase on stdin, for unlocking the
# key from a terminal without a graphical pinentry.
allow-loopback-pinentry
# Lets gpg-preset-signing load the passphrase from BWS after a restart
# (~/.config/git/bin/gpg-preset-signing, gpg-preset-signing.timer).
allow-preset-passphrase
